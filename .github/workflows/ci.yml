name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Scan tracked files for secrets
        run: bash scripts/secret_scan.sh
      - name: Install offline-test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Unit tests without external services or model API
        run: python -m unittest discover -s tests -q

