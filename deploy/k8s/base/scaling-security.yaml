apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: job-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: job-api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-gateway
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: backend-gateway}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: job-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: job-api}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: backend-gateway}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-traffic
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: backend-gateway}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 6379}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-runtime-traffic
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [job-api, job-worker, db-migrate, lake-bootstrap]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: backend-gateway}
      ports: [{protocol: TCP, port: 8000}]
  egress:
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 9200}
        - {protocol: TCP, port: 19530}
