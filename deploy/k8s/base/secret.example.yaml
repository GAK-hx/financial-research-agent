  name: financial-agent-secrets
  namespace: financial-agent
type: Opaque
stringData:
  MODEL_API_KEY: replace-me
  AGENT_API_KEY: replace-me
  GATEWAY_INTERNAL_API_KEY: replace-me
  GATEWAY_SECURITY_EXTERNAL_API_KEY: replace-me
