name: financial-research-agent

services:
  postgres:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-financial_agent}"
      POSTGRES_USER: "${POSTGRES_USER:-agent}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-agent-local}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-financial_agent}",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped
    networks: [agent-net]

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped
    networks: [agent-net]

  milvus:
    image: milvusdb/milvus:v2.4.0
    depends_on: [etcd]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      COMMON_STORAGETYPE: local
    command: milvus run standalone
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "${MILVUS_HOST_PORT:-19531}:19530"
    deploy:
      resources:
        limits:
          memory: 1800m
    restart: unless-stopped
    networks: [agent-net]

  elasticsearch:
    profiles: ["search"]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.6
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 1100m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped
    networks: [agent-net]

  redis:
    profiles: ["concurrency"]
    image: redis:8.4-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-agent-redis-local}"
    command:
      [
        "sh",
        "-c",
        "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\" --maxmemory 192mb --maxmemory-policy allkeys-lru",
      ]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped
    networks: [agent-net]

  backend-gateway:
    profiles: ["gateway"]
    build:
      context: ./backend-gateway
    environment:
      GATEWAY_PYTHON_BASE_URL: http://job-api:8000
      GATEWAY_INTERNAL_API_KEY: "${AGENT_API_KEY:-}"
      GATEWAY_SECURITY_EXTERNAL_API_KEY: "${GATEWAY_EXTERNAL_API_KEY:-}"
      GATEWAY_SECURITY_API_CLIENTS: "${GATEWAY_API_CLIENTS:-}"
      GATEWAY_SECURITY_DEFAULT_TENANT_ID: "${GATEWAY_DEFAULT_TENANT_ID:-gateway-local}"
      GATEWAY_SECURITY_DEFAULT_USER_ID: "${GATEWAY_DEFAULT_USER_ID:-gateway-local}"
      GATEWAY_SECURITY_DEFAULT_ROLE: "${GATEWAY_DEFAULT_ROLE:-admin}"
      GATEWAY_SECURITY_JWT_JWK_SET_URI: "${GATEWAY_JWT_JWK_SET_URI:-}"
      GATEWAY_RATE_LIMIT_REPLENISH_RATE: "${GATEWAY_RATE_LIMIT_REPLENISH_RATE:-5}"
      GATEWAY_RATE_LIMIT_BURST_CAPACITY: "${GATEWAY_RATE_LIMIT_BURST_CAPACITY:-10}"
      GATEWAY_RATE_LIMIT_REQUESTED_TOKENS: "${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:-1}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-agent-redis-local}"
    depends_on:
      redis:
        condition: service_healthy
      job-api:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health/readiness >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks: [agent-net]

  app:
    build:
      context: .
      args:
        INSTALL_PROFILE: rag
        INSTALL_HARNESS: "true"
        INSTALL_PERSISTENCE: "true"
        INSTALL_SEARCH: "true"
        INSTALL_SHARED_STATE: "true"
    env_file: .env
    environment:
      AGENT_FRAMEWORK: langchain
      ORCHESTRATION_RUNTIME: langgraph
      CHECKPOINT_BACKEND: postgres
      CHECKPOINT_DATABASE_URL: "postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent-local}@postgres:5432/${POSTGRES_DB:-financial_agent}?sslmode=disable"
      BUSINESS_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent-local}@postgres:5432/${POSTGRES_DB:-financial_agent}"
      CHECKPOINT_ENCRYPTION_ENABLED: "${CHECKPOINT_ENCRYPTION_ENABLED:-false}"
      CHECKPOINT_AES_KEY: "${CHECKPOINT_AES_KEY:-}"
      LANGGRAPH_STRICT_MSGPACK: "true"
      IDENTITY_MODE: "${IDENTITY_MODE:-local}"
      AGENT_API_KEY: "${AGENT_API_KEY:-}"
      PROVIDER_SHARED_RATE_LIMIT_ENABLED: "true"
    depends_on:
      milvus:
        condition: service_started
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - lake_data:/lake
      - model_cache:/root/.cache/huggingface
      - ./artifacts:/artifacts
      - ${REPORTS_HOST_DIR:-./data/reports}:/data/reports:ro
    deploy:
      resources:
        limits:
          memory: 1000m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [agent-net]

  data-bootstrap:
    profiles: ["ingestion"]
    build: .
    env_file: .env
    command: ["python", "-m", "financial_research_agent.data_management.bootstrap"]
    volumes:
      - lake_data:/lake
    deploy:
      resources:
        limits:
          memory: 384m
    restart: "no"
    networks: [agent-net]

  market-ingest:
    profiles: ["ingestion"]
    build:
      context: .
      args:
        INSTALL_PROFILE: ingestion
    env_file: .env
    command: ["python", "-m", "financial_research_agent.market.cli"]
    volumes:
      - lake_data:/lake
    deploy:
      resources:
        limits:
          memory: 768m
    restart: "no"
    networks: [agent-net]

  financial-ingest:
    profiles: ["ingestion"]
    build:
      context: .
      args:
        INSTALL_PROFILE: ingestion
    env_file: .env
    command: ["python", "-m", "financial_research_agent.financial.cli"]
    volumes:
      - lake_data:/lake
    deploy:
      resources:
        limits:
          memory: 900m
    restart: "no"
    networks: [agent-net]

  risk-data-test:
    profiles: ["risk"]
    build:
      context: .
      args:
        INSTALL_PROFILE: ingestion
    command: ["python", "-m", "unittest", "tests.test_risk_foundation", "-v"]
    environment:
      PYTHONPATH: /app/src
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./artifacts:/artifacts
    working_dir: /app
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    init: true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1400m
          pids: 256
    restart: "no"
    networks: [agent-net]

  risk-data-cached-ingest:
    profiles: ["risk-cached"]
    image: financial-research-agent-financial-ingest:latest
    pull_policy: never
    command: ["python", "-m", "unittest", "tests.test_risk_foundation", "-v"]
    environment:
      PYTHONPATH: /app/src
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./artifacts:/artifacts
    working_dir: /app
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    init: true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1400m
          pids: 256
    restart: "no"
    networks: [agent-net]

  risk-data-cached-eval:
    profiles: ["risk-cached"]
    image: financial-research-agent-job-api:latest
    pull_policy: never
    command: ["python", "-m", "unittest", "tests.test_risk_foundation", "-v"]
    environment:
      PYTHONPATH: /app/src
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./artifacts:/artifacts
    working_dir: /app
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    init: true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1400m
          pids: 256
    restart: "no"
    networks: [agent-net]

  risk-spark-validation:
    profiles: ["risk-cached"]
    image: financial-research-agent-factor-batch:latest
    pull_policy: never
    command:
      [
        "python",
        "-m",
        "financial_research_agent.risk.validation.spark_iceberg",
        "--output-root",
        "/artifacts/runtime_validation/spark_iceberg_v1",
        "--rows",
        "5000000",
        "--cpus",
        "4",
      ]
    environment:
      PYTHONPATH: /app/src
      PYTHONUNBUFFERED: "1"
      SPARK_LOCAL_IP: 127.0.0.1
    volumes:
      - ./src:/app/src:ro
      - ./artifacts:/artifacts
    working_dir: /app
    read_only: true
    tmpfs:
      - /tmp:size=1024m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    init: true
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6g
          pids: 512
    restart: "no"
    networks: [agent-net]

  factor-batch:
    profiles: ["analysis"]
    build:
      context: .
      args:
        INSTALL_PROFILE: analysis
    env_file: .env
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
    command:
      ["python", "-m", "financial_research_agent.analysis.cli", "--universe", "${ANALYSIS_UNIVERSE_ID:-demo_liquid_a_share}"]
    volumes:
      - lake_data:/lake
      - ./artifacts:/artifacts
    deploy:
      resources:
        limits:
          memory: 1600m
    restart: "no"
    networks: [agent-net]

  langgraph-spike:
    profiles: ["harness"]
    build:
      context: .
      args:
        INSTALL_PROFILE: core
        INSTALL_HARNESS: "true"
    env_file: .env
    command: ["python", "-m", "unittest", "tests.test_langgraph_spike", "-v"]
    volumes:
      - lake_data:/lake
      - ./artifacts:/artifacts
    deploy:
      resources:
        limits:
          memory: 512m
    restart: "no"
    networks: [agent-net]

  job-api:
    profiles: ["harness"]
    build:
      context: .
      args:
        INSTALL_PROFILE: rag
        INSTALL_HARNESS: "true"
        INSTALL_PERSISTENCE: "true"
        INSTALL_SEARCH: "true"
        INSTALL_SHARED_STATE: "true"
    env_file: .env
    environment:
      AGENT_FRAMEWORK: langchain
      ORCHESTRATION_RUNTIME: langgraph
      CHECKPOINT_BACKEND: postgres
      CHECKPOINT_DATABASE_URL: "postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent-local}@postgres:5432/${POSTGRES_DB:-financial_agent}?sslmode=disable"
      BUSINESS_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent-local}@postgres:5432/${POSTGRES_DB:-financial_agent}"
      CHECKPOINT_ENCRYPTION_ENABLED: "${CHECKPOINT_ENCRYPTION_ENABLED:-false}"
      CHECKPOINT_AES_KEY: "${CHECKPOINT_AES_KEY:-}"
      LANGGRAPH_STRICT_MSGPACK: "true"
      ANALYZE_VIA_JOBS: "true"
      IDENTITY_MODE: "${IDENTITY_MODE:-local}"
      AGENT_API_KEY: "${AGENT_API_KEY:-}"
    depends_on:
      milvus:
        condition: service_started
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "${JOB_API_PORT:-8002}:8000"
    volumes:
      - lake_data:/lake
      - model_cache:/root/.cache/huggingface
      - ./artifacts:/artifacts
      - ${REPORTS_HOST_DIR:-./data/reports}:/data/reports:ro
    deploy:
      resources:
        limits:
          memory: 700m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [agent-net]

  job-worker:
    profiles: ["harness"]
    build:
      context: .
      args:
        INSTALL_PROFILE: rag
        INSTALL_HARNESS: "true"
        INSTALL_PERSISTENCE: "true"
        INSTALL_SEARCH: "true"
        INSTALL_SHARED_STATE: "true"
    env_file: .env
    environment:
      AGENT_FRAMEWORK: langchain
      ORCHESTRATION_RUNTIME: langgraph
      CHECKPOINT_BACKEND: postgres
      CHECKPOINT_DATABASE_URL: "postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent-local}@postgres:5432/${POSTGRES_DB:-financial_agent}?sslmode=disable"
      BUSINESS_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent-local}@postgres:5432/${POSTGRES_DB:-financial_agent}"
      JOB_WORKER_ID: worker-1
      CHECKPOINT_ENCRYPTION_ENABLED: "${CHECKPOINT_ENCRYPTION_ENABLED:-false}"
      CHECKPOINT_AES_KEY: "${CHECKPOINT_AES_KEY:-}"
      LANGGRAPH_STRICT_MSGPACK: "true"
      PROVIDER_SHARED_RATE_LIMIT_ENABLED: "true"
    command:
      ["python", "-m", "financial_research_agent.jobs.worker"]
    depends_on:
      milvus:
        condition: service_started
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - lake_data:/lake
      - model_cache:/root/.cache/huggingface
      - ./artifacts:/artifacts
      - ${REPORTS_HOST_DIR:-./data/reports}:/data/reports:ro
    deploy:
      resources:
        limits:
          memory: 1200m
    stop_grace_period: 270s
    restart: unless-stopped
    networks: [agent-net]

  job-worker-2:
    profiles: ["workers"]
    extends: job-worker
    environment:
      AGENT_FRAMEWORK: langchain
      ORCHESTRATION_RUNTIME: langgraph
      CHECKPOINT_BACKEND: postgres
      CHECKPOINT_DATABASE_URL: "postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent-local}@postgres:5432/${POSTGRES_DB:-financial_agent}?sslmode=disable"
      BUSINESS_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent-local}@postgres:5432/${POSTGRES_DB:-financial_agent}"
      JOB_WORKER_ID: worker-2
      CHECKPOINT_ENCRYPTION_ENABLED: "${CHECKPOINT_ENCRYPTION_ENABLED:-false}"
      CHECKPOINT_AES_KEY: "${CHECKPOINT_AES_KEY:-}"
      LANGGRAPH_STRICT_MSGPACK: "true"

  db-migrate:
    build:
      context: .
      args:
        INSTALL_PROFILE: core
        INSTALL_PERSISTENCE: "true"
    env_file: .env
    environment:
      BUSINESS_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent-local}@postgres:5432/${POSTGRES_DB:-financial_agent}"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    deploy:
      resources:
        limits:
          memory: 256m
    restart: "no"
    networks: [agent-net]

  rag-index:
    profiles: ["rag"]
    build:
      context: .
      args:
        INSTALL_PROFILE: rag
    env_file: .env
    depends_on: [milvus]
    command: ["python", "-m", "financial_research_agent.rag.indexer", "--mode", "incremental"]
    volumes:
      - lake_data:/lake
      - model_cache:/root/.cache/huggingface
      - ./artifacts:/artifacts
      - ${REPORTS_HOST_DIR:-./data/reports}:/data/reports:ro
    deploy:
      resources:
        limits:
          memory: 1800m
    restart: "no"
    networks: [agent-net]

  knowledge-ingest:
    profiles: ["knowledge"]
    build:
      context: .
      args:
        INSTALL_PROFILE: core
        INSTALL_PERSISTENCE: "true"
    env_file: .env
    environment:
      BUSINESS_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent-local}@postgres:5432/${POSTGRES_DB:-financial_agent}"
    command:
      ["python", "-m", "financial_research_agent.knowledge.cli", "--limit", "${KNOWLEDGE_BATCH_LIMIT:-100}"]
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - lake_data:/lake
    deploy:
      resources:
        limits:
          memory: 512m
    restart: "no"
    networks: [agent-net]

volumes:
  postgres_data:
  etcd_data:
  milvus_data:
  lake_data:
  model_cache:
  elasticsearch_data:

networks:
  agent-net:
    driver: bridge
