[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-research-agent"
version = "0.1.0"
description = "Evidence-grounded financial research agent orchestrator"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain==1.3.14",
  "langchain-openai==1.4.1",
  "langgraph==1.2.9",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pyiceberg[sql-sqlite]>=0.8,<1",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]
ingestion = ["akshare>=1.18,<2"]
analysis = ["pyspark==4.2.0"]
harness = [
  "langchain==1.3.14",
  "langchain-openai==1.4.1",
  "langgraph==1.2.9",
]
persistence = [
  "alembic==1.18.5",
  "asyncpg==0.31.0",
  "langgraph-checkpoint-postgres==3.1.0",
  "psycopg[binary,pool]==3.3.4",
  "pycryptodome==3.23.0",
  "SQLAlchemy[asyncio]==2.0.51",
]
rag = [
  "pymilvus>=2.4.2,<3",
  "pymupdf>=1.24,<2",
  "sentence-transformers>=3,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
financial_research_agent = [
  "analysis/*.json",
  "evaluation/*.json",
  "skills/catalog.json",
  "skills/profiles.json",
  "skills/packages/*/*.yaml",
  "skills/packages/*/*/*.md",
  "knowledge/samples/*.json",
  "rag/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Establish a CI correctness baseline without rewriting the existing style debt.
# Broader formatting and modernization rules can be enabled incrementally.
select = ["E4", "E7", "E9", "F"]
